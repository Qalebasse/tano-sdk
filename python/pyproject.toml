[project]
name = "tano-sdk"
version = "0.1.0"
description = "Bibliothèque Python officielle de l'API de vérification d'identité Tano : dossiers, sessions de parcours, résultats, webhooks."
readme = "README.md"
keywords = ["tano", "kyc", "identity", "verification", "africa"]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tano_sdk"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]
